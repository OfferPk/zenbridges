<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0c2433" />
      <stop offset="100%" stop-color="#061118" />
    </radialGradient>
    <radialGradient id="stoneGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a4b60" />
      <stop offset="100%" stop-color="#10222d" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Subtle ripples -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#2FE6C8" stroke-width="1.5" opacity="0.12" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#2FE6C8" stroke-width="2" opacity="0.18" />

  <!-- Double Radiant Bridges (Horizontal) -->
  <line x1="150" y1="246" x2="362" y2="246" stroke="#2FE6C8" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <line x1="150" y1="266" x2="362" y2="266" stroke="#2FE6C8" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Single Bridge (Vertical to bottom island) -->
  <line x1="256" y1="170" x2="256" y2="342" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Island 1 (Left) -->
  <circle cx="150" cy="256" r="44" fill="url(#stoneGrad)" stroke="#2FE6C8" stroke-width="5" filter="url(#glow)" />
  <text x="150" y="267" font-family="-apple-system, sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- Island 2 (Right) -->
  <circle cx="362" cy="256" r="44" fill="url(#stoneGrad)" stroke="#2FE6C8" stroke-width="5" filter="url(#glow)" />
  <text x="362" y="267" font-family="-apple-system, sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- Island 3 (Top) -->
  <circle cx="256" cy="150" r="44" fill="url(#stoneGrad)" stroke="#00E5FF" stroke-width="5" filter="url(#glow)" />
  <text x="256" y="161" font-family="-apple-system, sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- Island 4 (Bottom) -->
  <circle cx="256" cy="362" r="44" fill="url(#stoneGrad)" stroke="#00E5FF" stroke-width="5" filter="url(#glow)" />
  <text x="256" y="373" font-family="-apple-system, sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
</svg>
